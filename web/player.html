<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Player</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;cursor:none;color:#fff;font-family:system-ui,sans-serif}
iframe{border:0;width:100%;height:100%;display:block}
</style></head>
<body>
<script>
// Usage: player.html?v=VIDEO_ID  (YouTube refuses embeds opened directly; it needs a parent page)
const id = new URLSearchParams(location.search).get("v") || "";
if (/^[A-Za-z0-9_-]{11}$/.test(id)) {
  const f = document.createElement("iframe");
  f.src = "https://www.youtube.com/embed/" + id +
          "?autoplay=1&loop=1&playlist=" + id + "&controls=0&rel=0&playsinline=1";
  f.allow = "autoplay; encrypted-media; picture-in-picture";
  f.referrerPolicy = "strict-origin-when-cross-origin";
  f.allowFullscreen = true;
  document.body.append(f);
} else {
  document.body.textContent = "No valid video id in the URL (?v=...)";
}
</script>
</body></html>
