<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live overlay</title>
<style>
/* ---------- themes: pick with ?theme=… , config.json "theme", or the control panel ---------- */
:root, [data-theme="midnight"]{
  --bg:#0a0e1a; --bg2:#121a30; --fg:#eef2fb; --muted:#8d98b5; --accent:#4ade80; --accent2:#38bdf8;
  --line:#1f2a47; --card:#111a31; --up:#4ade80; --down:#f87171; --glow:rgba(74,222,128,.12);
}
[data-theme="daylight"]{
  --bg:#f5f7fb; --bg2:#e6ebf5; --fg:#0f172a; --muted:#5b6785; --accent:#2563eb; --accent2:#7c3aed;
  --line:#d4dbea; --card:#ffffff; --up:#16a34a; --down:#dc2626; --glow:rgba(37,99,235,.10);
}
[data-theme="neon"]{
  --bg:#0b0414; --bg2:#1a0b2e; --fg:#fdf4ff; --muted:#b18bd6; --accent:#ff2bd6; --accent2:#22d3ee;
  --line:#3b1766; --card:#180a2c; --up:#34f5a5; --down:#ff5c7a; --glow:rgba(255,43,214,.16);
}
[data-theme="terminal"]{
  --bg:#050805; --bg2:#0a120a; --fg:#c9f7c9; --muted:#5f8f5f; --accent:#39ff14; --accent2:#9dff8a;
  --line:#143314; --card:#0a140a; --up:#39ff14; --down:#ff6b4a; --glow:rgba(57,255,20,.10);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;cursor:none;background:#000;color:var(--fg);
  font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif}
[data-theme="terminal"] body, [data-theme="terminal"] .stage{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}

/* fixed 1280x720 design canvas, scaled to whatever the screen is (720p, 1080p, a phone…) */
.stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center;overflow:hidden;
  background:radial-gradient(900px 500px at 85% -10%,var(--glow),transparent 60%),
             linear-gradient(180deg,var(--bg2),var(--bg) 60%);}
header{height:80px;display:flex;align-items:center;justify-content:space-between;padding:0 40px}
.brand{display:flex;align-items:center;gap:18px;min-width:0}
.live{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.16em;font-size:15px;color:#fff;
  background:var(--down);padding:6px 12px 6px 10px;border-radius:999px}
.live i{width:9px;height:9px;border-radius:50%;background:#fff;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
#title{font-size:30px;font-weight:750;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:700px}
.right{display:flex;align-items:center;gap:20px;color:var(--muted)}
#stale{display:none;font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--bg);background:var(--down);padding:4px 10px;border-radius:6px}
#clock{font-size:30px;font-variant-numeric:tabular-nums;color:var(--fg);font-weight:600}
#date{font-size:15px;text-align:right;line-height:1.2}
.progress{height:3px;background:var(--line)}
.progress b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2))}

main{position:absolute;top:83px;bottom:60px;left:0;right:0;padding:22px 40px 8px}
#scene{height:100%;display:flex;flex-direction:column;transition:opacity .35s ease,transform .35s ease}
#scene.out{opacity:0;transform:translateY(10px)}
.eyebrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.eyebrow h2{margin:0;font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:800}
.dots{display:flex;gap:7px}.dots span{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--accent);box-shadow:0 0 10px var(--accent)}

/* list scene */
ul{list-style:none;margin:0;padding:0;flex:1;display:flex;flex-direction:column;min-height:0}
li{flex:1;min-height:0;display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--line);
  animation:rise .5s both;animation-delay:calc(var(--i)*60ms)}
li:last-child{border-bottom:0}
li .n{width:34px;font-size:20px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;opacity:.85}
li .t{flex:1;font-size:25px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
li .m{font-size:19px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

/* stats scene */
.cards{flex:1;display:grid;gap:18px;align-content:center;grid-template-columns:repeat(var(--cols,3),1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:40px 34px;animation:rise .55s both;animation-delay:calc(var(--i)*90ms)}
.card .k{font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card .v{font-size:54px;font-weight:800;margin-top:10px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.card .v.sm{font-size:32px}
.card .d{margin-top:14px;font-size:22px;font-weight:700}
.up{color:var(--up)}.down{color:var(--down)}

/* text scene */
.big{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px}
.big p{margin:0;font-size:44px;font-weight:750;line-height:1.18;letter-spacing:-.02em;animation:rise .6s both;animation-delay:calc(var(--i)*140ms)}
.big p:first-child{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}

.empty{margin:auto;color:var(--muted);font-size:26px}

/* bottom: ticker + banner */
footer{position:absolute;left:0;right:0;bottom:0;height:60px;background:var(--card);border-top:1px solid var(--line);
  display:flex;align-items:center;overflow:hidden}
.tag{flex:none;height:100%;display:flex;align-items:center;padding:0 22px;background:var(--accent);color:var(--bg);font-weight:800;letter-spacing:.14em;font-size:14px;z-index:2}
.tickwrap{flex:1;overflow:hidden;white-space:nowrap}
.track{display:inline-flex;animation:scroll var(--dur,60s) linear infinite}
.track span{font-size:21px;padding-right:56px;color:var(--fg)}
.track span::before{content:"◆";color:var(--accent);margin-right:56px;font-size:13px;vertical-align:2px}
@keyframes scroll{to{transform:translateX(-50%)}}
#upd{flex:none;padding:0 22px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;z-index:2;background:var(--card)}
#banner{position:absolute;left:40px;right:40px;bottom:76px;z-index:5;padding:18px 28px;border-radius:16px;font-size:30px;font-weight:750;
  background:linear-gradient(90deg,var(--accent),var(--accent2));color:var(--bg);box-shadow:0 12px 40px rgba(0,0,0,.45);
  transform:translateY(140%);opacity:0;transition:transform .5s cubic-bezier(.2,.9,.2,1),opacity .4s}
#banner.show{transform:none;opacity:1}
</style>
</head>
<body>
<div class="stage" id="stage" data-theme="midnight">
  <header>
    <div class="brand"><div class="live"><i></i>LIVE</div><div id="title">Loading…</div></div>
    <div class="right"><span id="stale">OFFLINE DATA</span><div id="date"></div><div id="clock"></div></div>
  </header>
  <div class="progress"><b id="bar"></b></div>
  <main><div id="scene"></div></main>
  <div id="banner"></div>
  <footer><div class="tag">NEWS</div><div class="tickwrap"><div class="track" id="track"></div></div><div id="upd"></div></footer>
</div>

<script>
"use strict";
/* Query params:  ?theme=neon  ?scene=p1  ?rotate=10  ?demo=1 (use demo.json, no control API) */
const Q = new URLSearchParams(location.search);
const DEMO = Q.has("demo");
const $ = id => document.getElementById(id);
const stage = $("stage"), sceneEl = $("scene");

let data = null, state = {}, idx = 0, shown = "", sceneStart = performance.now(), tickSig = "", bannerKey = "";

/* ---- scale the 1280x720 canvas to the real window ---- */
function fit(){ const s = Math.min(innerWidth/1280, innerHeight/720);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener("resize", fit); fit();

/* ---- tiny DOM helper (textContent only, so feed content can never inject markup) ---- */
function h(tag, cls, text, style){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  if (style) for (const k in style) e.style.setProperty(k, style[k]);
  return e;
}

function renderPanel(p, i, total){
  const frag = document.createDocumentFragment();
  const eye = h("div","eyebrow");
  eye.append(h("h2","", p.title || ""));
  const dots = h("div","dots");
  for (let k = 0; k < total; k++) dots.append(h("span", k === i ? "on" : ""));
  if (total > 1) eye.append(dots);
  frag.append(eye);

  const items = p.items || [];
  if (p.kind === "stats"){
    const cards = h("div","cards", null, {"--cols": Math.min(3, Math.max(1, items.length))});
    items.slice(0, 9).forEach((it, n) => {
      const c = h("div","card", null, {"--i": n});
      c.append(h("div","k", it.title));
      c.append(h("div","v" + (String(it.meta).length > 14 ? " sm" : ""), it.meta));
      if (typeof it.delta === "number"){
        const up = it.delta >= 0;
        c.append(h("div","d " + (up ? "up" : "down"), `${up ? "▲" : "▼"} ${Math.abs(it.delta).toFixed(2)}% 24h`));
      }
      cards.append(c);
    });
    frag.append(cards);
  } else if (p.kind === "text"){
    const big = h("div","big");
    items.slice(0, 4).forEach((it, n) => big.append(h("p","", it.title, {"--i": n})));
    frag.append(big);
  } else {
    const ul = h("ul");
    items.slice(0, 8).forEach((it, n) => {
      const li = h("li","", null, {"--i": n});
      li.append(h("span","n", String(n + 1).padStart(2,"0")), h("span","t", it.title), h("span","m", it.meta));
      ul.append(li);
    });
    frag.append(ul);
  }
  return frag;
}

function show(i, animate){
  const panels = data.panels, p = panels[i];
  const sig = p.id + JSON.stringify(p.items) + panels.length + i;
  if (sig === shown) return;
  const draw = () => { sceneEl.replaceChildren(renderPanel(p, i, panels.length)); sceneEl.classList.remove("out"); };
  shown = sig;
  if (animate){ sceneEl.classList.add("out"); setTimeout(draw, 350); } else draw();
}

function buildTicker(){
  const clean = data.panels.flatMap(p => p.kind === "text" ? [] :
    p.items.map(it => p.kind === "stats" ? it.title + "  " + it.meta : it.title));
  const sig = data.ticker + "|" + clean.join("¦");
  if (sig === tickSig) return; tickSig = sig;
  const track = $("track"); track.replaceChildren();
  document.querySelector(".tag").style.display = data.ticker && clean.length ? "flex" : "none";
  if (!(data.ticker && clean.length)) return;
  for (let rep = 0; rep < 2; rep++) clean.forEach(t => track.append(h("span","",t)));
  const dur = Math.max(30, track.scrollWidth / 2 / 90);   // ~90 px per second
  track.style.setProperty("--dur", dur + "s");
}

/* ---- data + control-state polling ---- */
async function pollData(){
  try{
    const r = await fetch((DEMO ? "demo.json" : "data.json") + "?" + Date.now(), {cache:"no-store"});
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    if (!d.panels || !d.panels.length) return;
    data = d;
    $("title").textContent = d.title;
    document.title = d.title + " · live";
    $("upd").textContent = d.updated ? "Updated " + d.updated : "";
    const old = !DEMO && d.updated_ts && (Date.now()/1000 - d.updated_ts) > 600;
    $("stale").style.display = (old || d.panels.every(p => p.stale)) ? "block" : "none";
    if (idx >= d.panels.length) idx = 0;
    applyTheme(); buildTicker(); show(idx, false);
  }catch(e){ /* keep showing the last good frame */ }
}
async function pollState(){
  if (DEMO) return;
  try{ state = await (await fetch("api/state", {cache:"no-store"})).json(); applyTheme(); applyBanner(); }catch(e){}
}
function applyTheme(){
  stage.dataset.theme = Q.get("theme") || state.theme || (data && data.theme) || "midnight";
}
function applyBanner(){
  const b = $("banner"), msg = state.message || "";
  const key = msg + "|" + state.message_until;
  if (key === bannerKey) return; bannerKey = key;
  if (msg){ b.textContent = msg; b.classList.add("show"); } else b.classList.remove("show");
}

/* ---- scene rotation + progress bar (one rAF loop) ---- */
function frame(now){
  if (data){
    const rotate = (Number(Q.get("rotate")) || data.rotate_seconds || 15) * 1000;
    const pinned = Q.get("scene") || state.scene;
    const n = data.panels.length;
    if (pinned){
      const k = data.panels.findIndex(p => p.id === pinned);
      if (k >= 0 && k !== idx){ idx = k; show(idx, true); }
      $("bar").style.width = "100%";
    } else if (state.paused || n < 2){
      $("bar").style.width = "0";
      sceneStart = now;
    } else {
      const t = now - sceneStart;
      $("bar").style.width = Math.min(100, t / rotate * 100) + "%";
      if (t >= rotate){ idx = (idx + 1) % n; sceneStart = now; show(idx, true); }
    }
  }
  requestAnimationFrame(frame);
}

function tick(){
  const d = new Date();
  $("clock").textContent = d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", second:"2-digit"});
  $("date").textContent = d.toLocaleDateString([], {weekday:"long", month:"short", day:"numeric"});
}

setInterval(tick, 1000); tick();
setInterval(pollData, DEMO ? 60000 : 5000); pollData();
setInterval(pollState, 1500); pollState();
requestAnimationFrame(frame);
</script>
</body>
</html>
