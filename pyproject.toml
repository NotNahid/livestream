[project]
name = "livestream-proto"
version = "2.1.0"
description = "Headless live stream: Xvfb + Chromium + FFmpeg, driven by a small data agent."
requires-python = ">=3.9"

[tool.ruff]
line-length = 130
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]
ignore = ["S101", "S603", "S607", "S104"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"vtuber/face.py" = ["E501"]  # long SVG path strings
